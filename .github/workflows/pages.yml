name: Deploy demo to GitHub Pages

# Builds apps/web as a static export and publishes it to GitHub Pages.
# This is the marketing + product-UI demo (no backend). See DEPLOY_GITHUB_PAGES.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_STATIC_DEMO: "true"
          # Must match the repository name so assets resolve under /<repo>/.
          NEXT_PUBLIC_BASE_PATH: "/SG-Backend"
          NEXT_PUBLIC_ROOT_DOMAIN: "soakingarri.com"
        run: npm run build

      # Bypass Jekyll so the _next/ directory is served.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
