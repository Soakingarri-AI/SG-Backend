<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>$subject</title>
  <style>
    /* Progressive enhancement only. Every critical style is also inlined. */
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    table { border-collapse: collapse !important; }
    a { color: #c07f1f; }
    .sg-btn a:hover { background-color: #c07f1f !important; }
    @media screen and (max-width: 620px) {
      .sg-wrap { width: 100% !important; }
      .sg-pad { padding-left: 24px !important; padding-right: 24px !important; }
      .sg-h1 { font-size: 24px !important; line-height: 32px !important; }
      .sg-code { font-size: 15px !important; word-break: break-all !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#0b0e1a; -webkit-font-smoothing:antialiased;">

  <!-- Preview text shown in the inbox list, hidden in the body. -->
  <div style="display:none; font-size:1px; color:#0b0e1a; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
    $preheader
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0b0e1a;">
    <tr>
      <td align="center" style="padding: 32px 12px 40px 12px;">

        <table role="presentation" class="sg-wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

          <!-- Logo. The source is a 255x49 wordmark that already carries the
               brand name, so the sizes below keep its 5.2:1 ratio and no
               separate name is printed underneath. -->
          <tr>
            <td align="center" style="padding: 8px 0 26px 0;">
              <img src="$logo_url" width="208" height="40" alt="SoakinGarri AI"
                   style="display:block; width:208px; max-width:65%; height:auto; border:0; outline:none;" />
              <div style="margin-top:10px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; color:#7c839b; letter-spacing:0.04em;">
                The Knowledge Starship
              </div>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#ffffff; border-radius:16px; box-shadow:0 8px 28px rgba(0,0,0,0.28);">
              <!-- Gold accent bar -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="height:4px; line-height:4px; font-size:0; background-color:#e0a034; border-radius:16px 16px 0 0;">&nbsp;</td>
                </tr>
                <tr>
                  <td class="sg-pad" style="padding: 38px 44px 40px 44px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                    $content
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="sg-pad" style="padding: 26px 32px 0 32px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:19px; color:#6b7288; text-align:center;">
              $footer
              <div style="margin-top:14px; color:#4d5468;">
                &copy; $year SoakinGarri AI &middot; Learning, grounded in our own story.
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
