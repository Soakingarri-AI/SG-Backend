[project]
name = "soakingarri-api"
version = "0.1.0"
description = "SoakinGarri AI — unified FastAPI backend for all *.soakingarri.com subdomains"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "email-validator>=2.1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "sqlmodel>=0.0.19",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 probes bcrypt.__about__, which bcrypt>=4.1 removed; pin to 4.0.x.
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "boto3>=1.34",
    "anthropic>=0.30",
    "httpx>=0.27",
    "tenacity>=8.4",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

# Only ``app`` is the installable package; ``alembic``/``scripts``/``tests``
# ride along in the image but are not importable top-level packages.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One session-wide event loop so the loop-bound asyncpg engine and Redis client
# are shared across every test and fixture.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
